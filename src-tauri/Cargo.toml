[package]
name = "socrate"
version = "0.1.0"
description = "Socrate external overlay"
authors = ["Yop1"]
edition = "2021"

[lib]
name = "socrate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.0.0-rc", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cocoa = "0.25"
objc = "0.2"
core-graphics = "0.23"
core-foundation = "0.9"
libc = "0.2"
once_cell = "1.18"
image = { version = "0.25", default-features = false, features = ["png"] }
obfstr = "0.4"

[profile.release]
strip = true
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
incremental = false
debug = false
overflow-checks = true


